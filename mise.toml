[tools]
bun = "1.3"
helm = "3"

[settings]
experimental = true

# ── Bootstrap ─────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install site dependencies"
run = "bun install"

[tasks.deps-update]
description = "Update site dependencies"
run = "bun update"

# ── Site ──────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Start Astro dev server"
run = "bun dev"

[tasks.build]
description = "Build the static site"
run = "bun run build"

[tasks.preview]
description = "Preview the production build locally"
run = "bun run preview"

# ── Docker stack ──────────────────────────────────────────────────────────────

[tasks."stack:up"]
description = "Rebuild and start the portfolio container"
run = "docker compose up -d --build portfolio"

[tasks."stack:down"]
description = "Stop the portfolio container"
run = "docker compose down"

[tasks."stack:logs"]
description = "Tail container logs"
run = "docker compose logs -f"

# ── Docker image ──────────────────────────────────────────────────────────────

[tasks."docker:build"]
description = "Build the production image for the local platform"
run = "docker build -t nullcell/portfolio:dev ."

[tasks."docker:build-multi"]
description = "Build (without pushing) the multi-arch image"
run = "docker buildx build --platform linux/amd64,linux/arm64 -t nullcell/portfolio:dev ."

# ── Helm ──────────────────────────────────────────────────────────────────────

[tasks."helm:lint"]
description = "Lint the Helm chart"
run = "helm lint chart"

[tasks."helm:template"]
description = "Render the Helm chart locally"
run = "helm template portfolio chart"

# ── CI ────────────────────────────────────────────────────────────────────────

[tasks.ci]
description = "Full CI pipeline (build + chart lint)"
depends = ["build", "helm:lint"]
