[tools]
bun = "1.3"
node = "24" # Astro requires >= 22.12.0
helm = "3"

[settings]
experimental = true

# Only what CI calls. Day-to-day work is `bun dev` / `bun run preview`
# directly; wrapping those in a task alias buys nothing.

[tasks.install]
description = "Install site dependencies"
run = "bun install"

[tasks.build]
description = "Build the static site"
run = "bun run build"

[tasks."helm:lint"]
description = "Lint the Helm chart"
run = "helm lint chart"

[tasks.ci]
description = "Full CI pipeline (build + chart lint)"
depends = ["build", "helm:lint"]
