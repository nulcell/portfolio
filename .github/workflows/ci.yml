name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site + lint chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise (bun, helm)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: CI (site build + helm lint)
        run: mise run ci

  release:
    name: Push multi-arch image to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    # Publish only on version tags: vX.Y.Z → image tags X.Y.Z + latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: nullcell/portfolio
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
