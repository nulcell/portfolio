services:
  portfolio:
    container_name: nulcell-portfolio
    image: nullcell/portfolio:dev
    build:
      context: .
      dockerfile: Dockerfile
    cpu_count: 1
    cpus: "0.5"
    mem_limit: 50m
    mem_reservation: 25m
    mem_swappiness: 0
    cap_drop:
      - ALL
    privileged: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORTFOLIO_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
