server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    image/png
    image/jpeg
    font/woff2;

# Cache policy per path. Astro fingerprints /_astro/*, so those are immutable;
# other static assets get a week; HTML is never cached so a new deployment is
# picked up on the next request. First matching regex wins, so /_astro/ leads.
map $uri $cache_control {
    default                                                "no-cache";
    ~^/_astro/                                             "public, max-age=31536000, immutable";
    ~*\.(js|css|woff2?|ico|svg|png|jpg|jpeg|gif|webp|avif)$ "public, max-age=604800";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1k;

    # Recover the real client IP when traffic arrives via Cloudflare Tunnel.
    # Cloudflare sets CF-Connecting-IP at its edge; the value survives the
    # in-cluster Gateway/Ingress hop unchanged since only Cloudflare sets it.
    # set_real_ip_from only trusts nginx's *direct* peer (the cluster/compose
    # network), so direct requests with no proxy in front are left untouched.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Every response carries these. Do not add_header inside a location: that
    # replaces this whole set rather than extending it, which is how the old
    # per-location blocks silently dropped CSP from asset responses.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    error_page 404 /404.html;

    # Astro directory-format URLs - try the path, then directory index, then .html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Lightweight health endpoint for probes. default_type rather than
    # add_header, so the header set above survives here too.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
